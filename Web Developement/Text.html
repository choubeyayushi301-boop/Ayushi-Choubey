<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changing font sizes</title>
</head>
<body>
    <h1>Changing font sizes</h1>
    <basefont size="3">
        <p>here is some text in size three</p>
        <p>and here is some <font size="7">Largest</font>
        <font size="+3">t</font>
        <font size="+2">e</font>
        <font size="+1">x</font>
        <font size="-1">t</font>
    </p>
    </basefont>
</body>
</html>
