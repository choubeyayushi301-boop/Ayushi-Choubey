<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specifity CSS</title>
    <style>
        /* the specificity of this selector is 1 */
       h1{
        color: aqua;
       } 

       /* the specificity of this selector is 10 */

       .cpurple{
           color: purple;
       }

       /* the specificity of this selector is 1 + 10 = 11 */
       h1.yellow{
        color: yellow;
       }
       /* the specificity of this selector is 1 + 10 + 10 + 10 + 10 = 41 */
       a.harryclass.rohan-class[href]:hover {
        color:blueviolet;
       }

       /* this is an example of attribute selector */
      /*  [data-x=a]{
        background-color: red;
    }  */
    </style>
</head>
<body>
    <h1 class="yellow cpurple" data-x="a">CSS Specificity</h1>
</body>
</html>
