<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shadow in css</title>
    <style>
        .box{
            border: 2px solid black;
            padding:34px;
            box-shadow: 5px 15px 5px #70a711;
        }
        .text-element { text-shadow:
            10px 5px 3px #e695f7 ;
            border: 2px solid green;
            outline-offset: 47px;
        }
    </style>
</head>
<body>
    <div class="box">
        i am a box
    </div>

    <p class="text-element">
        Lorem ipsum, dolor sit amet consectetur adipisicing elit. Neque, aliquid nemo, doloribus voluptate, facilis eveniet quisquam hic harum dicta perferendis saepe repellat porro. Ratione, ipsa? Praesentium fugiat enim dolores velit sunt repellat ratione numquam?
    </p>
</body>
</html>
